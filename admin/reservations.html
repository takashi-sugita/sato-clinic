<!doctype html><html lang="ja"><meta charset="UTF-8"><title>予約管理</title><link rel="stylesheet" href="../css/style.css"><main class="content-section"><div class="container"><h1 class="content-title">予約管理</h1><div id="list"></div><a href="../index.html">トップへ戻る</a></div></main><script>const k='satoClinicReservations';function draw(){const a=JSON.parse(localStorage.getItem(k)||'[]');document.querySelector('#list').innerHTML=a.length?a.map(r=>`<p>${r.date} ${r.time}　${r.name}（${r.phone}）</p>`).join(''):'予約はありません。'}draw();</script>
