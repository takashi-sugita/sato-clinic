<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約管理｜佐藤医院</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="content-section"><div class="container"><h1 class="content-title">予約管理</h1><div id="list"></div><p><a href="../index.html">トップへ戻る</a></p></div></main><script>const k='satoClinicReservations';function draw(){const a=JSON.parse(localStorage.getItem(k)||'[]').sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));document.querySelector('#list').innerHTML=a.length?'<table class="admin-reservation-table"><thead><tr><th>日付</th><th>時間</th><th>予約者名</th><th>電話番号</th></tr></thead><tbody>'+a.map(r=>`<tr><td>${r.date}</td><td>${r.time}</td><td>${r.name}</td><td>${r.phone}</td></tr>`).join('')+'</tbody></table>':'予約はありません。'}draw();</script></body></html>
