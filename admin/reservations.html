<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約管理｜佐藤医院</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="content-section"><div class="container"><h1 class="content-title">予約管理</h1><div id="list"></div><p><a href="../index.html">トップへ戻る</a></p></div></main><script>const k='satoClinicReservations';function draw(){const a=JSON.parse(localStorage.getItem(k)||'[]').sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));document.querySelector('#list').innerHTML='<table class="admin-reservation-table"><thead><tr><th>予約日</th><th>予約時間</th><th>区分</th><th>診療科目</th><th>診察券番号</th><th>お名前</th><th>電話番号</th></tr></thead><tbody>'+a.map(r=>`<tr><td>${r.date}</td><td>${r.time}</td><td>${r.type==='existing'?'再診':'初診'}</td><td>${r.department||''}</td><td>${r.cardNumber||''}</td><td>${r.name}</td><td>${r.phone}</td></tr>`).join('')+(a.length?'':'<tr><td colspan="7">予約はありません。</td></tr>')+'</tbody></table>'}draw();</script></body></html>
